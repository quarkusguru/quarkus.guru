name: Roq Site Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: roq-site-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate Roq site
        run: QUARKUS_ROQ_GENERATOR_BATCH=true mvn -B package quarkus:run
        env:
          SITE_URL: https://quarkus.guru

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/roq

      - name: Upload site for the S3 job
        uses: actions/upload-artifact@v4
        with:
          name: roq-site
          path: target/roq
          retention-days: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-s3:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the generated site
        uses: actions/download-artifact@v4
        with:
          name: roq-site
          path: roq-site

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync ./roq-site s3://quarkus.guru --delete
