<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting to quarkus.guru</title>
  <link rel="canonical" href="https://quarkus.guru/">
  <meta http-equiv="refresh" content="0; url=https://quarkus.guru/">
  <script>
    (function () {
      var base = "https://quarkus.guru";
      var target = base + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Quarkus Guru has moved to <a href="https://quarkus.guru/">quarkus.guru</a>. Redirecting you now.</p>
</body>
</html>
